[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-outo"
version = "0.1.0"
description = "Aplicacao desktop de diagnostico automovel com PySide6 e comunicacao ELM327."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8,<7", "pyserial>=3.5,<4", "python-dotenv>=1,<2", "pydantic>=2.12,<3"]

[project.scripts]
scanner-outo = "scanner_outo.__main__:main"

[project.optional-dependencies]
ui = ["PySide6>=6.8"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8"]
gemini = ["google-genai>=1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner_outo = ["ui/assets/fonts/*", "ui/assets/icons/*"]

